plugins {
    id 'com.android.application'
}

android {
    namespace 'com.accesspay.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.accesspay.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // التوقيع بمفتاح الـ debug عشان الـ APK يتثبّت مباشرة.
            // للنشر على Google Play استبدله بمفتاحك الخاص.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
